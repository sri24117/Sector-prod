# Override for a host where Coolify's Traefik (container `coolify-proxy`,
# network `coolify`) already owns ports 80/443. Use it together with the main file:
#
#   docker compose -f docker-compose.yml -f infra/compose.coolify.yml <command>
#
# It changes four things and nothing else:
#   1. SEctOr's own Caddy proxy is not started (Traefik routes instead).
#   2. Postgres and Redis publish no host ports, so they cannot clash with
#      other apps on the box (or be reached from outside it).
#   3. web and api join the `coolify` network with Traefik labels for
#      APP_DOMAIN / API_DOMAIN, HTTPS via Traefik's `letsencrypt` resolver,
#      and an HTTP -> HTTPS redirect.
#   5. Postgres and Redis get unique aliases (sector-postgres, sector-redis).
#      The api/web containers also sit on the shared `coolify` network, where
#      Coolify's own database answers to "postgres" and its Redis to "redis";
#      the generic names would reach the wrong server. .env must use the
#      sector-* hostnames in DATABASE_URL and REDIS_URL.
#   4. TRUST_PROXY covers Traefik's address on the coolify network (already a
#      private range in the main file), so per-client rate limits keep working.

services:
  proxy:
    profiles: ["caddy"] # never started unless explicitly asked for

  postgres:
    ports: !reset []
    networks:
      default:
        aliases: [sector-postgres]

  redis:
    ports: !reset []
    networks:
      default:
        aliases: [sector-redis]

  backup:
    environment:
      PGHOST: sector-postgres

  api:
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sector-api.rule=Host(`${API_DOMAIN:?set API_DOMAIN in .env}`)
      - traefik.http.routers.sector-api.entrypoints=https
      - traefik.http.routers.sector-api.tls=true
      - traefik.http.routers.sector-api.tls.certresolver=letsencrypt
      - traefik.http.routers.sector-api.service=sector-api
      - traefik.http.services.sector-api.loadbalancer.server.port=4000
      - traefik.http.routers.sector-api-http.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.sector-api-http.entrypoints=http
      - traefik.http.routers.sector-api-http.middlewares=sector-https
      - traefik.http.routers.sector-api-http.service=sector-api
      - traefik.http.middlewares.sector-https.redirectscheme.scheme=https
      - traefik.http.middlewares.sector-https.redirectscheme.permanent=true

  web:
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.sector-web.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      - traefik.http.routers.sector-web.entrypoints=https
      - traefik.http.routers.sector-web.tls=true
      - traefik.http.routers.sector-web.tls.certresolver=letsencrypt
      - traefik.http.routers.sector-web.service=sector-web
      - traefik.http.services.sector-web.loadbalancer.server.port=3000
      - traefik.http.routers.sector-web-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.sector-web-http.entrypoints=http
      - traefik.http.routers.sector-web-http.middlewares=sector-web-https
      - traefik.http.routers.sector-web-http.service=sector-web
      - traefik.http.middlewares.sector-web-https.redirectscheme.scheme=https
      - traefik.http.middlewares.sector-web-https.redirectscheme.permanent=true

networks:
  coolify:
    external: true
